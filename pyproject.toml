[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "psysem"
version = "0.1.0a1"
description = "Psychology-oriented structural equation modeling (SEM) package for Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "PsychologyMeasurement Contributors" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12"
]

[project.urls]
Homepage = "https://github.com/fumitsoku-beep/ESEM"
Repository = "https://github.com/fumitsoku-beep/ESEM"
Issues = "https://github.com/fumitsoku-beep/ESEM/issues"
Changelog = "https://github.com/fumitsoku-beep/ESEM/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mkdocs>=1.6",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.9"
]

[tool.hatch.build.targets.wheel]
packages = ["src/psysem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
